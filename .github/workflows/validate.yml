name: Validate Atlas Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, release contract, package, and launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Require release bump for shipped Atlas changes
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/validate-release-diff.ts --base "$BASE_SHA"
      - name: Validate plugin manifests and MCP wiring
        run: bun scripts/validate-manifests.ts
      - name: Test immutable plugin release contract
        run: bun test scripts/verify-plugin-release.test.ts
      - name: Test distribution state and base-diff guards
        run: bun test scripts/cli-pin-policy.test.ts scripts/validate-release-diff.test.ts
      - name: Validate clean public package
        run: bun scripts/validate-package.ts
      - name: Lint POSIX launcher scripts
        run: shellcheck atlas/bin/atlas atlas/bin/atlas-forwarder atlas/bin/forwarder-test.sh atlas/bin/launcher-test.sh
