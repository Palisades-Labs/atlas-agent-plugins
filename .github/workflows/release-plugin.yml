name: Release Atlas Plugin

on:
  push:
    tags: ['atlas--v*']

# The native plugin tag already exists before this workflow starts. The
# repository-scoped token only creates and verifies the matching release.
permissions:
  contents: write

concurrency:
  group: atlas-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & Release Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prove the protected plugin tag resolves to reviewed default-branch
          # history. A shallow tag checkout cannot establish that ancestry.
          fetch-depth: 0

      - name: Verify plugin tag belongs to reviewed default-branch history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_PROTECTED" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is not protected by a branch/tag protection rule or ruleset"
            exit 1
          fi
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "::error::GitHub event did not identify the repository default branch"
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if [ -z "$TAG_COMMIT" ]; then
            echo "::error::could not peel $GITHUB_REF_NAME to a commit"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME resolves to $TAG_COMMIT, which is not reachable from origin/$DEFAULT_BRANCH"
            exit 1
          fi
          echo "$GITHUB_REF_NAME resolves to reviewed origin/$DEFAULT_BRANCH history."

      - name: Guard — GitHub immutable releases must be enforced
        env:
          # GitHub's immutable-releases endpoint requires Administration: read,
          # which the repository GITHUB_TOKEN cannot request. Reuse the same
          # distribution-scoped fine-grained credential as the source release
          # workflow only for this read-only preflight; all release operations
          # below use the same-repository GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PLUGIN_REPO_TOKEN is empty; immutable-release enforcement cannot be proven"
            exit 1
          fi
          if ! IMMUTABILITY=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases"); then
            echo "::error::could not prove immutable releases are enabled; PLUGIN_REPO_TOKEN needs Administration: read on $GITHUB_REPOSITORY"
            exit 1
          fi
          if [ "$(printf '%s' "$IMMUTABILITY" | jq -r '.enabled')" != "true" ]; then
            echo "::error::GitHub immutable releases are not enforced on $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "GitHub immutable releases are enforced on $GITHUB_REPOSITORY."

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Validate the tagged distribution package
        run: bun scripts/validate-package.ts

      - name: Verify immutable plugin/CLI release contract
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/atlas-cli-release"
          CLI_VERSION=$(tr -d '\r\n' < atlas/bin/cli-version)
          CLI_RELEASE_TAG="atlas-cli-v$CLI_VERSION"
          mkdir -p "$RELEASE_ROOT"

          gh release view "$CLI_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,isImmutable,assets \
            | jq '{
                tagName,
                isDraft,
                isPrerelease,
                isImmutable,
                assets: [.assets[] | {name}]
              }' \
            > "$RUNNER_TEMP/cli-release.json"

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName,isDraft,isPrerelease,isImmutable \
            | jq --arg tag "$GITHUB_REF_NAME" '
                [.[] | select(.tagName == $tag)]
                | if length == 0 then null
                  elif length == 1 then .[0]
                  else error("plugin release lookup was ambiguous")
                  end
              ' \
            > "$RUNNER_TEMP/existing-plugin-release.json"

          jq -n \
            --slurpfile cli "$RUNNER_TEMP/cli-release.json" \
            --slurpfile plugin "$RUNNER_TEMP/existing-plugin-release.json" \
            '{
              cliRelease: $cli[0],
              existingPluginRelease: $plugin[0]
            }' \
            > "$RUNNER_TEMP/release-metadata.json"

          gh release download "$CLI_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_ROOT"

          bun scripts/verify-plugin-release.ts \
            --root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME" \
            --metadata "$RUNNER_TEMP/release-metadata.json" \
            --release-checksums "$RELEASE_ROOT/checksums.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify all CLI release signatures
        env:
          CLI_VERSION: ${{ steps.contract.outputs.cli_version }}
        run: |
          set -euo pipefail
          RELEASE_ROOT="$RUNNER_TEMP/atlas-cli-release"
          SIGNER_IDENTITY="https://github.com/blast-double/auto-prospector/.github/workflows/release-cli.yml@refs/tags/cli-v$CLI_VERSION"
          (cd "$RELEASE_ROOT" && sha256sum --check checksums.txt)
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            cosign verify-blob "$RELEASE_ROOT/atlas-$target" \
              --bundle "$RELEASE_ROOT/atlas-$target.sigstore.json" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      - name: Create native immutable plugin release
        if: steps.contract.outputs.release_mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ steps.contract.outputs.cli_version }}
          PLUGIN_RELEASE_TAG: ${{ steps.contract.outputs.plugin_release_tag }}
          PLUGIN_VERSION: ${{ steps.contract.outputs.plugin_version }}
        run: |
          set -euo pipefail
          # Backticks in the release notes are intentional Markdown, not shell expansion.
          # shellcheck disable=SC2016
          NOTES=$(printf 'Atlas plugin v%s, pinned to immutable Atlas CLI v%s.\n\nExact Claude marketplace ref: `%s`.\nExact Codex marketplace ref: `%s`.\n' \
            "$PLUGIN_VERSION" "$CLI_VERSION" "$PLUGIN_RELEASE_TAG" "$PLUGIN_RELEASE_TAG")
          gh release create "$PLUGIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Atlas Plugin v$PLUGIN_VERSION" \
            --notes "$NOTES"

      - name: Verify plugin release is published and immutable
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_RELEASE_TAG: ${{ steps.contract.outputs.plugin_release_tag }}
        run: |
          set -euo pipefail
          RELEASE=$(gh release view "$PLUGIN_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,isImmutable)
          # shellcheck disable=SC2016
          if ! printf '%s' "$RELEASE" | jq -e --arg tag "$PLUGIN_RELEASE_TAG" '
            .tagName == $tag
            and .isDraft == false
            and .isPrerelease == false
            and .isImmutable == true
          ' >/dev/null; then
            echo "::error::$PLUGIN_RELEASE_TAG is not one exact published immutable plugin release"
            exit 1
          fi
          echo "$PLUGIN_RELEASE_TAG is published and immutable."
